name: ai-content

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicontent
      POSTGRES_PASSWORD: aicontent
      POSTGRES_DB: aicontent
    ports:
      - "54329:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicontent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  video:
    build:
      context: .
      dockerfile: video-engine/Dockerfile
    environment:
      ENGINE_INTERNAL_TOKEN: compose-engine-token
    volumes:
      - media:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:32147/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/backend/AiContent.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RUN_WORKER_IN_API: "false"
      DATABASE_URL: Host=postgres;Port=5432;Database=aicontent;Username=aicontent;Password=aicontent
      REDIS_URL: redis:6379
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/storage
      ENGINE_BASE_URL: http://video:32147
      ENGINE_INTERNAL_TOKEN: compose-engine-token
      ENGINE_DATA_ROOT: /data/engine
      JWT_SIGNING_KEY: compose-dev-signing-key-32-characters
      SEED_DEMO_USER: "true"
      AI_PROVIDER: fixture
      AI_MODEL: ""
      PUBLIC_API_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:3410,http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      video:
        condition: service_healthy

  agent-worker:
    build:
      context: .
      dockerfile: src/backend/AiContent.AgentWorker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: Host=postgres;Port=5432;Database=aicontent;Username=aicontent;Password=aicontent
      REDIS_URL: redis:6379
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/storage
      ENGINE_BASE_URL: http://video:32147
      ENGINE_INTERNAL_TOKEN: compose-engine-token
      ENGINE_DATA_ROOT: /data/engine
      JWT_SIGNING_KEY: compose-dev-signing-key-32-characters
      AI_PROVIDER: fixture
      AI_MODEL: ""
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      video:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3410:3000"
    depends_on:
      - api

volumes:
  pg:
  media:
