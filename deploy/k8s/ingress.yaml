apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-content
  namespace: ai-content
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["studio.example.com"]
      secretName: ai-content-tls
  rules:
    - host: studio.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: ai-content-api, port: { number: 80 } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: ai-content-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: ai-content-web, port: { number: 80 } } }
