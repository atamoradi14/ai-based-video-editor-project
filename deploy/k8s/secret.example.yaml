# Copy to a local file that is not committed, replace every CHANGE_ME value,
# and apply it yourself before deploy-k8s.sh. The deploy script refuses to
# create this secret and never prints secret values.
apiVersion: v1
kind: Secret
metadata:
  name: ai-content-secrets
  namespace: ai-content
type: Opaque
stringData:
  JWT_SIGNING_KEY: CHANGE_ME
  AI_API_KEY: CHANGE_ME
  ENGINE_INTERNAL_TOKEN: CHANGE_ME
  DATABASE_URL: Host=postgres.example;Port=5432;Database=aicontent;Username=aicontent;Password=CHANGE_ME
  REDIS_URL: redis.example:6379
  AZURE_STORAGE_CONNECTION_STRING: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
